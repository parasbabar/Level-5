name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Test, Compile Compact, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Midnight Compact Compiler
        run: |
          echo "Installing official Midnight Compact CLI..."
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          echo "Updating Compact compiler..."
          compact update || true
          compact compile --version

      - name: Compile Compact Smart Contract
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          npm run compact

      - name: Run Contract & Circuit Tests
        run: npm test

      - name: Build Frontend Application
        run: npm run build
